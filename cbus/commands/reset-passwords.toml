version = 1
command = "users.reset-passwords"
program = "the8020/users/reset-passwords"
summary = "Reset all passwords with a recovery account"
description = "Remove every platform password and authentication session, then enable the existing recovery account with the securely supplied new password. Roles and certificates are preserved. Requires --confirm."
usage = "<recovery-username> --confirm"
mutates_state = true
restart_behavior = "none"
[[secrets]]
name = "password"
required = true
prompt = "New recovery password: "
confirmation_prompt = "Confirm recovery password: "
stdin_option = "password-stdin"
[[examples]]
command = "users.reset-passwords admin --confirm"
