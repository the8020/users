version = 1
command = "users.set-password"
program = "the8020/users/set-password"
summary = "Set a user password"
description = "Replace a password and revoke current sessions. An empty password prevents login."
usage = "<username>"
mutates_state = true
restart_behavior = "none"
[[secrets]]
name = "password"
required = true
prompt = "Password (empty removes it): "
confirmation_prompt = "Confirm password: "
stdin_option = "password-stdin"
[[examples]]
command = "users.set-password alice"
