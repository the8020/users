"the8020.users.user.view" = "View an account, its roles and authentication sign-ins; value is username. Users always see their own account."
"the8020.users.user.create" = "Create an account; value is username."
"the8020.users.user.delete" = "Delete an account and its authentication sessions, then publish users.deleted; value is username."
"the8020.users.user.edit" = "Change account details or enablement; value is username. Authenticated users may edit their own profile."
"the8020.users.user.password" = "Replace or remove a password; value is username. Authenticated users may replace their own password."
"the8020.users.user.sessions" = "End authentication sign-ins; value is username. Users may end their own sign-ins."
"the8020.users.user.certificates" = "List, enroll, or remove public client certificates; value is username. Authenticated users may manage their own certificates."
