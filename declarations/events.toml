"users.created" = "An account was created. Other packages subscribe to prepare their own data for the new user, such as default role assignments. Listener input is the ordinary event envelope; data is { username: string }. Published after the account row is inserted, as the creating user. Delivery uses the ordinary asynchronous event dispatcher."
"users.deleted" = "An account and its authentication sessions were deleted. Other packages subscribe to delete their own data belonging to that user. Listener input is the ordinary event envelope; data is { username: string }. Published after the users-package transaction commits, as the deleting user. Delivery uses the ordinary asynchronous event dispatcher."
